[package]
name = "mcpg-plugin-security-field-crypto"
version = "0.1.0-alpha.16"
license = "BUSL-1.1"
edition = "2024"
description = "Field-level crypto ToolGate plugin for MCPG (dev.mcpg.tool-gate.field-crypto) — XChaCha20-Poly1305 encrypt/decrypt of named argument/result fields."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14", features = ["static-firstparty"] }
mcpg-glob = { git = "https://github.com/mcpg-dev/mcpg-glob", tag = "v0.1.0-beta.14", version = "=0.1.0-beta.14" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
# Same AEAD the in-tree credential-cache / cluster-state cipher uses
# (XChaCha20-Poly1305). Pure-Rust, no TLS / system libs.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
tracing = "0.1"

[features]
default = ["cdylib-export"]
cdylib-export = []
static-firstparty = []
